# NIDE base 组合包：每个 profile 都共享的宿主服务。
#
# 这一层**只 insert**；profile 自己的 cordis.yml / cordis.patch.yml 之后按 id 覆盖。
# 服务的启动顺序由各自的 `inject` 决定，行序没有语义（与 DSH 一致）。
#
# 加一个宿主服务 = 这里加一行，不改任何装配代码。
- insert:
    - id: project
      name: '{{NIDE_ROOT}}/packages/project/src/index.ts'
      core: true
      description: projects.json 的唯一实现：列表 / 打开 / 移除 / 关闭 / 启动恢复
    - id: content
      name: '{{NIDE_ROOT}}/packages/content/src/index.ts'
      core: true
      description: 内容读写：文件树、章节、伏笔、图鉴、概述
    - id: config
      name: '{{NIDE_ROOT}}/packages/config/src/index.ts'
      core: true
      description: 项目配置 nide.json 的读 / 更新 / 初始化；同时作为配置纯函数库
    - id: plugins
      name: '{{NIDE_ROOT}}/packages/plugin-runtime/src/index.ts'
      core: true
      description: 插件清单 / 启停 / 贡献点（视图、设置页、语言包）/ 内建视图表
    - id: plugin-permissions
      name: '{{NIDE_ROOT}}/packages/plugin-permissions/src/index.ts'
      core: true
      description: 插件权限：声明展开与 RPC 准入（RpcAuthorizer 的实现）
    - id: plugin-storage
      name: '{{NIDE_ROOT}}/packages/plugin-storage/src/index.ts'
      core: true
      description: 每插件命名空间的 JSON 存储（同步视图 + 合并写盘）
    - id: plugin-capabilities
      name: '{{NIDE_ROOT}}/packages/plugin-capabilities/src/index.ts'
      core: true
      description: 插件桌面能力：os.* 权限检查后经 shell 反向桥执行
    - id: plugin-backend
      name: '{{NIDE_ROOT}}/packages/plugin-backend/src/index.ts'
      core: true
      description: 插件后端子进程：fork / 握手 / 调用 / 起停 / 卸载脚本
    - id: i18n
      name: '{{NIDE_ROOT}}/packages/i18n/src/index.ts'
      core: true
      description: 本地化：语言包瀑布、语言偏好、标题解析
    - id: appearance
      name: '{{NIDE_ROOT}}/packages/appearance/src/index.ts'
      core: true
      description: 主题 / 外观：偏好与主题解析；原生明暗走 shell 反桥
    - id: secrets
      name: '{{NIDE_ROOT}}/packages/secrets/src/index.ts'
      core: true
      description: 密钥仓（无 RPC）：密文落盘，加解密走 safeStorage 反桥
    - id: ai
      name: '{{NIDE_ROOT}}/packages/ai/src/index.ts'
      core: true
      description: AI 供应商：配置、测试连接、SSE 转发

    # ---- 内置插件（普通包 + 组合行；不再由插件服务扫目录发现）----
    - id: plugin-demo
      name: '{{NIDE_ROOT}}/packages/plugins/demo/src/index.ts'
    - id: plugin-lang-en
      name: '{{NIDE_ROOT}}/packages/plugins/lang-en/src/index.ts'
    - id: plugin-ai-provider
      name: '{{NIDE_ROOT}}/packages/plugins/ai-provider/src/index.ts'
